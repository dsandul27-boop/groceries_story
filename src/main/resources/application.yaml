spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME:dorindb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

  media:
    dir: ${MEDIA_DIR:${user.home}/.groceries/media}
