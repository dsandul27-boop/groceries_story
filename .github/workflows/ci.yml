name: CI

# Build + test every PR (and pushes to main). Checkstyle enforces the code-style
# gate first; `mvn verify` then compiles, runs the H2-based test suite, and
# enforces the JaCoCo coverage gate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Checkstyle (code-style gate)
        run: ./mvnw -B --no-transfer-progress checkstyle:check

      - name: Build, test & coverage gate
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
